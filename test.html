<!DOCTYPE html>
<html>
<head>
<style>
  .fade-up {
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 0.8s, transform 0.8s;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="fade-up" id="box" data-delay="0.5">Hello</div>
  </div>
  <script>
    setTimeout(() => {
      const el = document.getElementById('box');
      const delay = parseFloat(el.dataset.delay);
      el.style.animation = `fadeUp 0.9s ease ${delay}s both`;
    }, 2000);
  </script>
</body>
</html>
